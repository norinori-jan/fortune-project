<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<link rel="manifest" href="manifest.json">
<meta name="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#07050f">
<script>if('serviceWorker' in navigator){navigator.serviceWorker.register('./service-worker.js');}</script>
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>大アルカナ タロット占い</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700&family=Shippori+Mincho:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #07050f;
  --gold: #c9a84c;
  --gold2: #e8c97a;
  --gold3: #f5e4a8;
  --purple: #5a2d8a;
  --purple2: #8b5ccf;
  --purple3: #b48ae8;
  --text: #e8dcc8;
  --text2: #8a7a68;
  --card-back: #110d1f;
  --card-border: #2e1f5e;
  --glow: rgba(201,168,76,0.25);
  --gemini-color: #4285f4;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--text);font-family:'Shippori Mincho','游明朝','Yu Mincho',serif;min-height:100svh;overflow-x:hidden;}
body::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse 80% 60% at 15% 10%, rgba(90,45,138,0.18) 0%, transparent 60%),radial-gradient(ellipse 60% 80% at 85% 90%, rgba(201,168,76,0.08) 0%, transparent 60%);pointer-events:none;z-index:0;}
.stars{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.star{position:absolute;background:white;border-radius:50%;animation:twinkle var(--dur,3s) ease-in-out infinite var(--delay,0s);opacity:0;}
@keyframes twinkle{0%,100%{opacity:0;transform:scale(0.4)}50%{opacity:var(--op,.6);transform:scale(1)}}
header{position:relative;z-index:10;text-align:center;padding:clamp(40px,8vw,70px) 20px 16px}
.title-en{font-family:'Cinzel Decorative',serif;font-size:11px;letter-spacing:8px;color:var(--gold);opacity:0.6;margin-bottom:10px;}
.title-ja{font-size:clamp(22px,6vw,30px);font-weight:300;letter-spacing:10px;background:linear-gradient(135deg,var(--gold2),var(--gold3),var(--purple3));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
.divider{width:80px;height:1px;margin:14px auto;background:linear-gradient(90deg,transparent,var(--gold),transparent);position:relative;}
.divider::before{content:'✦';position:absolute;top:-8px;left:50%;transform:translateX(-50%);color:var(--gold);font-size:10px;background:var(--bg);padding:0 6px;}
.spread-selector{position:relative;z-index:10;display:flex;gap:8px;padding:0 16px;overflow-x:auto;scrollbar-width:none;justify-content:center;flex-wrap:wrap;margin-bottom:4px;}
.spread-btn{flex-shrink:0;padding:7px 14px;border:1px solid var(--card-border);background:rgba(14,11,26,0.8);color:var(--text2);font-family:'Shippori Mincho',serif;font-size:11px;letter-spacing:2px;border-radius:20px;cursor:pointer;transition:all .3s;white-space:nowrap;}
.spread-btn.active{border-color:var(--gold);color:var(--gold);background:rgba(201,168,76,0.08);box-shadow:0 0 14px var(--glow);}
.question-area{position:relative;z-index:10;padding:16px 20px 0}
.question-input{width:100%;background:rgba(14,11,26,0.9);border:1px solid var(--card-border);border-radius:12px;padding:13px 16px;color:var(--text);font-family:'Shippori Mincho',serif;font-size:13px;letter-spacing:1px;outline:none;transition:border-color .3s;resize:none;height:56px;}
.question-input::placeholder{color:var(--text2);opacity:0.5}
.question-input:focus{border-color:var(--purple2)}
.card-table{position:relative;z-index:10;min-height:180px;display:flex;align-items:center;justify-content:center;padding:24px 16px;gap:10px;flex-wrap:wrap;}
/* ケルト十字レイアウト noriオリジナル
  col:  1          2          3          4          5
  row1             ③顕在意識                        ⑩結論
  row2  ⑤潜在意識  ①現在      ⑥過去               ⑨願望
  row3             ④原因・妨害                      ⑧周辺環境
  row4             ②根底                           ⑦本人の立場
*/
.card-table.celtic-layout{
  display:grid;
  grid-template-columns:repeat(5,72px);
  grid-template-rows:repeat(4,126px);
  gap:8px 10px;
  justify-content:center;
  align-items:center;
  padding:24px 16px;
  min-height:560px;
}
.card-table.celtic-layout .card-slot{display:flex;flex-direction:column;align-items:center;}
.card-table.celtic-layout .card-slot:nth-child(1){grid-column:2;grid-row:2;}
.card-table.celtic-layout .card-slot:nth-child(2){grid-column:2;grid-row:4;}
.card-table.celtic-layout .card-slot:nth-child(3){grid-column:2;grid-row:1;}
.card-table.celtic-layout .card-slot:nth-child(4){grid-column:3;grid-row:2;}
.card-table.celtic-layout .card-slot:nth-child(5){grid-column:2;grid-row:3;}
.card-table.celtic-layout .card-slot:nth-child(6){grid-column:1;grid-row:2;}
.card-table.celtic-layout .card-slot:nth-child(7){grid-column:5;grid-row:4;}
.card-table.celtic-layout .card-slot:nth-child(8){grid-column:5;grid-row:3;}
.card-table.celtic-layout .card-slot:nth-child(9){grid-column:5;grid-row:2;}
.card-table.celtic-layout .card-slot:nth-child(10){grid-column:5;grid-row:1;}
.card-slot{perspective:900px}
.card{width:72px;height:118px;position:relative;transform-style:preserve-3d;transition:transform .75s cubic-bezier(.4,0,.2,1);cursor:pointer;}
.card.flipped{transform:rotateY(180deg)}
.card-face{position:absolute;inset:0;border-radius:10px;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;}
.card-back{background:var(--card-back);border:1.5px solid var(--card-border);box-shadow:0 4px 24px rgba(0,0,0,.7),inset 0 0 40px rgba(90,45,138,.08);}
.card-back::before{content:'';position:absolute;inset:7px;border:1px solid rgba(90,45,138,.25);border-radius:6px;background:repeating-linear-gradient(45deg,transparent,transparent 7px,rgba(90,45,138,.03) 7px,rgba(90,45,138,.03) 8px);}
.card-back-symbol{font-size:22px;opacity:.35;position:relative;z-index:1}
.card-front{background:linear-gradient(160deg,#1a1130 0%,#0f0c1e 100%);border:1.5px solid var(--gold);box-shadow:0 4px 24px rgba(0,0,0,.9),0 0 20px var(--glow);transform:rotateY(180deg);padding:6px 4px;justify-content:space-between;}
.card-number{font-family:'Cinzel Decorative',serif;font-size:7px;color:var(--gold);opacity:.55;letter-spacing:1px;align-self:flex-start;}
.card-symbol-front{font-size:26px;line-height:1}
.card-name-ja{font-size:8px;letter-spacing:2px;color:var(--gold2);text-align:center;font-weight:500}
.card-orientation{font-size:7px;color:var(--text2);letter-spacing:1px}
.card-pos-label{font-size:7px;color:var(--purple3);letter-spacing:1px;text-align:center;}
.card.reversed.flipped .card-front{transform:rotateY(180deg) rotate(180deg)}
.action-area{position:relative;z-index:10;display:flex;flex-direction:column;align-items:center;gap:10px;padding:0 20px 20px;}
.instruction{font-size:11px;letter-spacing:2px;color:var(--text2);text-align:center;margin-bottom:2px;min-height:20px;}
.shuffle-btn{position:relative;width:100%;max-width:300px;padding:17px;background:transparent;border:1.5px solid var(--gold);border-radius:8px;color:var(--gold);font-family:'Cinzel Decorative',serif;font-size:12px;letter-spacing:4px;cursor:pointer;overflow:hidden;transition:all .4s;}
.shuffle-btn:active{background:rgba(201,168,76,.08);box-shadow:0 0 30px var(--glow)}
.shuffle-btn.loading{pointer-events:none;border-color:var(--purple2);color:var(--purple2);opacity:.7}
.reveal-btn{width:100%;max-width:300px;padding:13px;background:rgba(90,45,138,.15);border:1px solid var(--purple);border-radius:8px;color:var(--purple3);font-family:'Shippori Mincho',serif;font-size:12px;letter-spacing:2px;cursor:pointer;transition:all .3s;display:none;}
.reveal-btn.show{display:block}
.reset-btn{width:100%;max-width:300px;padding:11px;background:transparent;border:1px solid rgba(255,255,255,.08);border-radius:8px;color:var(--text2);font-family:'Shippori Mincho',serif;font-size:11px;letter-spacing:3px;cursor:pointer;transition:all .3s;display:none;}
.reset-btn.show{display:block}
.result-area{position:relative;z-index:10;padding:0 20px 0;display:none}
.result-area.show{display:block}
.result-card{background:rgba(14,11,26,.95);border:1px solid var(--card-border);border-radius:16px;padding:18px;margin-bottom:10px;animation:fadeUp .55s ease forwards;opacity:0;}
.result-card:nth-child(1){animation-delay:.05s}
.result-card:nth-child(2){animation-delay:.15s}
.result-card:nth-child(3){animation-delay:.25s}
.result-card:nth-child(4){animation-delay:.35s}
.result-card:nth-child(5){animation-delay:.45s}
.result-card:nth-child(6){animation-delay:.55s}
.result-card:nth-child(7){animation-delay:.65s}
.result-card:nth-child(8){animation-delay:.75s}
.result-card:nth-child(9){animation-delay:.85s}
.result-card:nth-child(10){animation-delay:.95s}
@keyframes fadeUp{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}
.pos-label{font-size:9px;letter-spacing:3px;color:var(--gold);opacity:.65;margin-bottom:4px}
.pos-number{font-size:8px;color:var(--purple3);letter-spacing:1px;margin-bottom:2px;}
.result-name{display:flex;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.result-name-ja{font-size:19px;font-weight:500;color:var(--gold2);letter-spacing:2px}
.result-ori{font-size:10px;padding:2px 8px;border-radius:10px;border:1px solid}
.result-ori.upright{border-color:var(--gold);color:var(--gold)}
.result-ori.reversed{border-color:#c06060;color:#c06060}
.result-keywords{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:10px}
.keyword-tag{font-size:10px;padding:3px 10px;background:rgba(90,45,138,.18);border:1px solid rgba(90,45,138,.38);border-radius:10px;color:var(--purple3);letter-spacing:1px;}
.result-advice{font-size:12px;line-height:2;color:var(--text2);border-top:1px solid rgba(255,255,255,.04);padding-top:10px;}
.element-note{font-size:10px;color:rgba(138,122,104,.6);margin-top:8px;letter-spacing:1px;font-style:italic;}
.wuxing-badge{font-size:10px;padding:2px 8px;border-radius:8px;border:1px solid}
.wx-木{background:rgba(76,160,76,.15);color:#7dca7d;border-color:rgba(76,160,76,.3)}
.wx-火{background:rgba(200,80,60,.15);color:#e88c7a;border-color:rgba(200,80,60,.3)}
.wx-土{background:rgba(180,150,80,.15);color:#d4b870;border-color:rgba(180,150,80,.3)}
.wx-金{background:rgba(200,180,120,.15);color:#e8d898;border-color:rgba(200,180,120,.3)}
.wx-水{background:rgba(60,120,200,.15);color:#7aaee8;border-color:rgba(60,120,200,.3)}

/* AI Section */
.ai-section{position:relative;z-index:10;padding:0 20px 20px;display:none;}
.ai-section.show{display:block}
.api-keys-panel{background:rgba(14,11,26,.98);border:1px solid var(--card-border);border-radius:16px;padding:18px;margin-bottom:16px;}
.api-keys-title{font-size:10px;letter-spacing:3px;color:var(--gemini-color);opacity:.9;margin-bottom:14px;text-align:center;}
.api-key-row{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
.api-key-input{flex:1;background:rgba(7,5,15,.8);border:1px solid var(--card-border);border-radius:8px;padding:8px 12px;color:var(--text);font-family:monospace;font-size:11px;outline:none;transition:border-color .3s;}
.api-key-input:focus{border-color:var(--gemini-color)}
.api-key-save{padding:8px 14px;background:rgba(66,133,244,.15);border:1px solid var(--gemini-color);border-radius:8px;color:var(--gemini-color);font-size:11px;cursor:pointer;}
.ai-read-btn{width:100%;padding:16px;background:linear-gradient(135deg,rgba(66,133,244,.15),rgba(90,45,138,.15));border:1px solid var(--gemini-color);border-radius:10px;color:#7ab3f8;font-family:'Cinzel Decorative',serif;font-size:12px;letter-spacing:3px;cursor:pointer;transition:all .4s;margin-bottom:16px;position:relative;overflow:hidden;}
.ai-read-btn.loading{pointer-events:none;opacity:.6}
.ai-read-btn.loading::after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.04),transparent);animation:shimmer 1.5s infinite}
@keyframes shimmer{0%{transform:translateX(-100%)}100%{transform:translateX(100%)}}
.ai-response-panel{background:rgba(14,11,26,.97);border:1px solid var(--gemini-color);border-radius:14px;overflow:hidden;display:none;}
.ai-response-panel.show{display:block}
.ai-panel-header{display:flex;align-items:center;gap:8px;padding:12px 16px;border-bottom:1px solid rgba(255,255,255,.04);}
.ai-panel-name{font-size:12px;letter-spacing:2px;font-weight:500;color:var(--gemini-color);}
.ai-status{font-size:10px;margin-left:auto;opacity:.6;letter-spacing:1px;}
.ai-status.thinking{color:var(--purple3);animation:pulse 1.5s ease-in-out infinite}
.ai-status.done{color:#7dca7d}
.ai-status.error{color:#c06060}
@keyframes pulse{0%,100%{opacity:.4}50%{opacity:1}}
.ai-panel-body{padding:16px;min-height:100px;}
.ai-response-text{font-size:13px;line-height:2;color:var(--text2);white-space:pre-wrap;}
.ai-placeholder{font-size:11px;color:rgba(138,122,104,.35);letter-spacing:2px;text-align:center;padding:20px 0;}

/* Celtic layout hint */
.celtic-hint{background:rgba(90,45,138,.08);border:1px solid rgba(90,45,138,.2);border-radius:12px;padding:12px 16px;margin:0 20px 4px;font-size:11px;color:var(--text2);line-height:1.8;display:none;}
.celtic-hint.show{display:block}

@keyframes cardShuffle{0%{transform:translateY(0) rotate(0deg)}25%{transform:translateY(-14px) rotate(-4deg)}75%{transform:translateY(-16px) rotate(-2deg)}100%{transform:translateY(0) rotate(0deg)}}
.card.shuffling{animation:cardShuffle .5s ease-in-out infinite}
.card.shuffling:nth-child(2){animation-delay:.1s}
.card.shuffling:nth-child(3){animation-delay:.2s}
@keyframes wiggle{0%,100%{transform:rotate(0deg)}30%{transform:rotate(-2deg) translateY(-3px)}70%{transform:rotate(2deg) translateY(-3px)}}
.card.ready:not(.flipped){animation:wiggle 2.5s ease-in-out infinite;cursor:pointer}
.bottom-pad{height:60px}
.toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%) translateY(20px);background:rgba(14,11,26,.95);border:1px solid var(--card-border);border-radius:12px;padding:10px 18px;font-size:13px;color:var(--text);opacity:0;transition:all .3s;pointer-events:none;white-space:nowrap;z-index:100;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<div class="stars" id="stars"></div>
<header>
  <div class="title-en">Major Arcana Tarot</div>
  <div class="title-ja">大アルカナ占い</div>
  <div class="divider"></div>
</header>

<div class="spread-selector">
  <button class="spread-btn active" data-spread="one">一枚引き</button>
  <button class="spread-btn" data-spread="three">スリーカード</button>
  <button class="spread-btn" data-spread="yesno">YES / NO</button>
  <button class="spread-btn" data-spread="daily">今日のカード</button>
  <button class="spread-btn" data-spread="celtic">ケルト十字（10枚）</button>
</div>

<div class="celtic-hint" id="celticHint">
  📖 ケルト十字（10枚・noriオリジナル配置）<br>
  ③顕在意識が上、④原因・妨害が中央、②根底が下<br>
  ⑤潜在意識が左、⑥過去が右<br>
  右列：⑦本人の立場→⑧周辺環境→⑨願望→⑩結論（下から上）
</div>

<div class="question-area">
  <textarea class="question-input" id="question" placeholder="問いかけを記してください…（任意）"></textarea>
</div>

<div class="card-table" id="cardTable"></div>

<div class="action-area">
  <div class="instruction" id="instruction">カードをシャッフルして、運命に問いかけてください</div>
  <button class="shuffle-btn" id="shuffleBtn" onclick="startShuffle()">✦ SHUFFLE ✦</button>
  <button class="reveal-btn" id="revealBtn" onclick="revealAll()">すべて開く</button>
  <button class="reset-btn" id="resetBtn" onclick="resetAll()">↺ もう一度占う</button>
</div>

<div class="result-area" id="resultArea"></div>

<!-- Gemini AI Section -->
<div class="ai-section" id="aiSection">
  <div class="api-keys-panel">
    <div class="api-keys-title">◈ Gemini AI 読み解き ◈</div>
    <div style="font-size:11px;color:var(--text2);text-align:center;">✓ APIキーはサーバーで安全に管理されています</div>
  </div>

  <button class="ai-read-btn" id="aiReadBtn" onclick="readWithGemini()">
    ✦ Gemini で読み解く ✦
  </button>

  <div class="ai-response-panel" id="geminiPanel">
    <div class="ai-panel-header">
      <div style="width:8px;height:8px;border-radius:50%;background:var(--gemini-color);"></div>
      <div class="ai-panel-name">Gemini 2.5 Flash</div>
      <div class="ai-status" id="geminiStatus">待機中</div>
    </div>
    <div class="ai-panel-body">
      <div class="ai-placeholder" id="geminiPlaceholder">「Gemini で読み解く」を押してください</div>
      <div class="ai-response-text" id="geminiResponse" style="display:none"></div>
    </div>
  </div>
</div>

<div class="bottom-pad"></div>
<div class="toast" id="toast"></div>

<script>

{"id":"M18","number":18,"name_en":"The Moon","name_ja":"月","wuxing":"水","element_note":"幻想・不安・満ち欠ける水の陰。","upright":{"keywords":["不安","幻想","見通し難","潜在意識"],"action_advice":"先が見えず不安が募る時期ですが、無理に動くと迷走します。輪郭がはっきりするまで静観してください。"},"reversed":{"keywords":["霧晴れる","不安解消","真実露見","現実回帰"],"action_advice":"徐々に不透明だった状況から霧が晴れ、真実が見えてきます。確信を持って次の具体的な行動を起こしましょう。"}},{"id":"M19","number":19,"name_en":"The Sun","name_ja":"太陽","wuxing":"火","element_note":"顕現・陽の極・万物を照らす火。","upright":{"keywords":["成功","活力","明確","祝福"],"action_advice":"すべての問題が明るい光に照らされ解決します。エネルギー全開で自己表現し、喜びを周囲と共有しましょう。"},"reversed":{"keywords":["不調","延期","陰り","過信"],"action_advice":"完全な失敗ではないものの、パワー不足や計画の遅延が生じやすいです。過信を捨て、エネルギーを充電してください。"}},{"id":"M20","number":20,"name_en":"Judgement","name_ja":"審判","wuxing":"金","element_note":"決断・召喚・金の断ち切る力。","upright":{"keywords":["復活","覚醒","吉報","過去清算"],"action_advice":"過去の努力が報われ、再びチャンスが巡ってきます。心の声に従って、迷わず立ち上がってください。"},"reversed":{"keywords":["再起不能","後悔","決定遅延","見送り"],"action_advice":"過去の失敗を悔やみ、決断を先送りにしています。同じ過ちを繰り返さないと誓い、今度こそ前を向きましょう。"}},{"id":"M21","number":21,"name_en":"The World","name_ja":"世界","wuxing":"土","element_note":"完成・統合・中央の土。すべてを包む。","upright":{"keywords":["完成","統合","達成","完全なる調和"],"action_advice":"現在のサイクルは見事に完成へと至りました。この素晴らしい成果を祝い、次の新たなステージへ進む準備をしてください。"},"reversed":{"keywords":["未完成","中途半端","マンネリ","限界"],"action_advice":"ゴールの一歩手前で停滞、あるいは不完全燃焼を感じています。詰めが甘い部分がないか、最後の一踏ん張りを見せましょう。"}}];

const SYMBOLS = {"M00":"🃏","M01":"🔮","M02":"📖","M03":"🌸","M04":"⚔️","M05":"🏛️","M06":"💞","M07":"🏺","M08":"🦁","M09":"🔦","M10":"☸️","M11":"⚖️","M12":"🙃","M13":"💀","M14":"🌊","M15":"⛓️","M16":"⚡","M17":"⭐","M18":"🌙","M19":"☀️","M20":"📯","M21":"🌍"};

const SPREADS = {
  one:    {count:1, positions:["現在の状況"]},
  three:  {count:3, positions:["過去","現在","未来"]},
  yesno:  {count:1, positions:["答え"]},
  daily:  {count:1, positions:["今日のメッセージ"]},
  celtic: {count:10, positions:["①現在の状況","②根底","③顕在意識","④過去","⑤潜在意識","⑥近未来","⑦本人の立場","⑧周辺環境","⑨願望","⑩結論"]},
};

const SERVER_URL = "http://localhost:5000";
const SPREAD_MAP = {one:"one_oracle",three:"three_card",yesno:"yes_no",daily:"daily",celtic:"celtic_mini"};

let currentSpread = 'one';
let drawnCards = [];
let flippedCount = 0;
let phase = 'idle';
let geminiKey = localStorage.getItem('tarot_gemini_key') || '';

// Init
function createStars() {
  const c = document.getElementById('stars');
  for (let i=0;i<90;i++){
    const s=document.createElement('div');s.className='star';
    const sz=Math.random()*2+0.4;
    s.style.cssText=`width:${sz}px;height:${sz}px;left:${Math.random()*100}%;top:${Math.random()*100}%;--dur:${2+Math.random()*5}s;--delay:${Math.random()*6}s;--op:${0.25+Math.random()*0.7}`;
    c.appendChild(s);
  }
}

// Gemini key
function saveGeminiKey() {
  const val = document.getElementById('geminiKeyInput').value.trim();
  if (!val) { showToast('キーを入力してください'); return; }
  geminiKey = val;
  localStorage.setItem('tarot_gemini_key', val);
  document.getElementById('geminiKeyStatus').textContent = '✓ Gemini キー保存済み';
  document.getElementById('geminiKeyStatus').style.color = '#7dca7d';
  showToast('✓ Gemini キー保存しました');
}

if (geminiKey) {
  document.getElementById('geminiKeyInput').value = geminiKey;
  document.getElementById('geminiKeyStatus').textContent = '✓ Gemini キー設定済み';
  document.getElementById('geminiKeyStatus').style.color = '#7dca7d';
}

// Spread select
document.querySelectorAll('.spread-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.spread-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentSpread = btn.dataset.spread;
    document.getElementById('celticHint').classList.toggle('show', currentSpread === 'celtic');
    resetAll();
  });
});

async function startShuffle() {
  if (phase === 'shuffling' || phase === 'selecting') return;
  phase = 'shuffling';
  resetUI();
  const spread = SPREADS[currentSpread];
  const table = document.getElementById('cardTable');
  table.innerHTML = '';
  for (let i=0;i<spread.count;i++) {
    const slot = document.createElement('div');
    slot.className = 'card-slot';
    slot.innerHTML = `<div class="card shuffling"><div class="card-face card-back"><div class="card-back-symbol">✦</div></div></div>`;
    table.appendChild(slot);
  }
  const btn = document.getElementById('shuffleBtn');
  btn.classList.add('loading'); btn.textContent = '✦ SHUFFLING ✦';
  document.getElementById('instruction').textContent = 'シャッフル中…';

  try {
    const response = await fetch(`${SERVER_URL}/api/tarot/draw`, {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({spread_type: SPREAD_MAP[currentSpread], question: document.getElementById('question').value.trim()}),
    });
    if (!response.ok) throw new Error(`Server error: ${response.status}`);
    const data = await response.json();
    if (!data.success) throw new Error(data.error || 'Unknown error');

    const registryEntry = data.data;
    drawnCards = registryEntry.cards.map(c => {
      const cardId = typeof c.card_id === 'string' ? c.card_id : `M${String(c.card_id).padStart(2,'0')}`;
      const cardData = CARDS.find(card => card.id === cardId) || CARDS[0];
      return {
        ...cardData,
        isReversed: c.orientation === 'reversed',
        position_label: c.position_label,
        position_index: c.position_index,
      };
    });

    flippedCount = 0;
    table.innerHTML = '';
    if (currentSpread === 'celtic') {
      table.classList.add('celtic-layout');
    } else {
      table.classList.remove('celtic-layout');
    }
    drawnCards.forEach((card, i) => {
      const slot = document.createElement('div');
      slot.className = 'card-slot';
      slot.innerHTML = `<div class="card ready" id="card-${i}" onclick="flipCard(${i})">
        <div class="card-face card-back"><div class="card-back-symbol">✦</div></div>
        <div class="card-face card-front">
          <div class="card-number">No.${card.number}</div>
          <div class="card-symbol-front">${SYMBOLS[card.id]}</div>
          <div class="card-name-ja">${card.name_ja}</div>
          <div class="card-orientation">${card.isReversed ? '逆位置' : '正位置'}</div>
          <div class="card-pos-label">${card.position_label}</div>
        </div>
      </div>`;
      table.appendChild(slot);
    });
    btn.classList.remove('loading'); btn.textContent = '✦ SHUFFLE ✦';
    document.getElementById('instruction').textContent =
      spread.count===1 ? 'カードに触れて、運命を開いてください' : `${spread.count}枚のカードを順に開いてください`;
    document.getElementById('revealBtn').classList.add('show');
    phase = 'selecting';
  } catch(error) {
    btn.classList.remove('loading'); btn.textContent = '✦ SHUFFLE ✦';
    document.getElementById('instruction').textContent = `エラー: ${error.message}`;
    phase = 'idle';
  }
}

function flipCard(i) {
  if (phase !== 'selecting') return;
  const el = document.getElementById(`card-${i}`);
  if (!el || el.classList.contains('flipped')) return;
  el.classList.remove('ready');
  if (drawnCards[i].isReversed) el.classList.add('reversed');
  el.classList.add('flipped');
  flippedCount++;
  if (flippedCount === drawnCards.length) setTimeout(showResults, 650);
}

function revealAll() {
  if (phase !== 'selecting') return;
  drawnCards.forEach((_, i) => flipCard(i));
}

function showResults() {
  phase = 'done';
  const spread = SPREADS[currentSpread];
  const area = document.getElementById('resultArea');
  area.innerHTML = '';
  drawnCards.forEach((card, i) => {
    const ori = card.isReversed ? card.reversed : card.upright;
    const oriLabel = card.isReversed ? '逆位置' : '正位置';
    const oriClass = card.isReversed ? 'reversed' : 'upright';
    const div = document.createElement('div');
    div.className = 'result-card';
    div.innerHTML = `
      <div class="pos-number">${i+1} / ${spread.count}</div>
      <div class="pos-label">${spread.positions[i] || `カード ${i+1}`}</div>
      <div class="result-name">
        <span class="result-name-ja">${SYMBOLS[card.id]} ${card.name_ja}</span>
        <span class="result-ori ${oriClass}">${oriLabel}</span>
        <span class="wuxing-badge wx-${card.wuxing}">${card.wuxing}</span>
      </div>
      <div class="result-keywords">${ori.keywords.map(k=>`<span class="keyword-tag">${k}</span>`).join('')}</div>
      <div class="result-advice">${ori.action_advice}</div>
      <div class="element-note">${card.element_note}</div>
    `;
    area.appendChild(div);
  });
  area.classList.add('show');
  document.getElementById('aiSection').classList.add('show');
  document.getElementById('geminiPanel').classList.remove('show');
  document.getElementById('geminiPlaceholder').style.display = 'block';
  document.getElementById('geminiResponse').style.display = 'none';
  document.getElementById('geminiStatus').textContent = '待機中';
  document.getElementById('geminiStatus').className = 'ai-status';
  area.scrollIntoView({behavior:'smooth', block:'start'});
  document.getElementById('revealBtn').classList.remove('show');
  document.getElementById('resetBtn').classList.add('show');
  document.getElementById('instruction').textContent = 'カードはあなたに語りかけています';
}

function resetUI() {
  document.getElementById('resultArea').classList.remove('show');
  document.getElementById('resultArea').innerHTML = '';
  document.getElementById('aiSection').classList.remove('show');
  document.getElementById('revealBtn').classList.remove('show');
  document.getElementById('resetBtn').classList.remove('show');
}

function resetAll() {
  drawnCards = []; flippedCount = 0; phase = 'idle';
  const ct = document.getElementById('cardTable');
  ct.innerHTML = '';
  ct.classList.remove('celtic-layout');
  document.getElementById('question').value = '';
  resetUI();
  document.getElementById('instruction').textContent = 'カードをシャッフルして、運命に問いかけてください';
}

// Gemini AI読み解き
function buildPrompt() {
  const spread = SPREADS[currentSpread];
  const question = document.getElementById('question').value.trim();
  let ctx = `【スプレッド】${currentSpread === 'celtic' ? 'ケルト十字（10枚）' : spread.positions.join('・')}\n【質問】${question || '（指定なし）'}\n\n`;
  drawnCards.forEach((card, i) => {
    const ori = card.isReversed ? card.reversed : card.upright;
    ctx += `■ ${spread.positions[i]}：${card.name_ja}（${card.name_en}）${card.isReversed ? '逆位置' : '正位置'}\n`;
    ctx += `  キーワード：${ori.keywords.join('・')}\n`;
    ctx += `  意味：${ori.action_advice}\n  五行：${card.wuxing}（${card.element_note}）\n\n`;
  });
  return ctx;
}

const SYSTEM_PROMPT = `あなたは神秘的で洞察力のあるタロット占い師「叡智の声」です。以下のルールで占いの解読を行ってください。
- 日本語で、詩的かつ親しみやすい文体で語りかけてください
- 各カードの意味を統合し、全体的なメッセージとして伝えてください
- スプレッドの文脈（位置の意味）を必ず考慮してください
- 五行（木火土金水）の観点も織り交ぜてください
- ケルト十字の場合は10枚すべての位置を丁寧に読み解いてください
- 400〜600文字程度でまとめてください
- 最後に一言、励ましや行動のヒントを添えてください`;

async function readWithGemini() {
  const btn = document.getElementById('aiReadBtn');
  btn.classList.add('loading'); btn.textContent = '✦ 読み解き中… ✦';
  document.getElementById('geminiPanel').classList.add('show');
  document.getElementById('geminiPlaceholder').style.display = 'none';
  document.getElementById('geminiResponse').style.display = 'none';
  document.getElementById('geminiStatus').textContent = '思考中...';
  document.getElementById('geminiStatus').className = 'ai-status thinking';

  try {
    const response = await fetch(`${SERVER_URL}/api/tarot/interpret`, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({cards_context: buildPrompt(), ais: ['gemini']})
    });
    const data = await response.json();
    const result = data.interpretations?.gemini;
    const text = result?.text || 'エラーが発生しました';
    document.getElementById('geminiResponse').textContent = text;
    document.getElementById('geminiResponse').style.display = 'block';
    document.getElementById('geminiStatus').textContent = result?.success ? '完了 ✓' : 'エラー';
    document.getElementById('geminiStatus').className = 'ai-status ' + (result?.success ? 'done' : 'error');
  } catch(error) {
    document.getElementById('geminiResponse').textContent = `エラー: ${error.message}`;
    document.getElementById('geminiResponse').style.display = 'block';
    document.getElementById('geminiStatus').textContent = 'エラー';
    document.getElementById('geminiStatus').className = 'ai-status error';
  }
  btn.classList.remove('loading'); btn.textContent = '✦ 再度読み解く ✦';
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

createStars();
