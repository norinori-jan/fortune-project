<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>大アルカナ タロット占い</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700&family=Shippori+Mincho:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #07050f;
  --gold: #c9a84c;
  --gold2: #e8c97a;
  --gold3: #f5e4a8;
  --purple: #5a2d8a;
  --purple2: #8b5ccf;
  --purple3: #b48ae8;
  --text: #e8dcc8;
  --text2: #8a7a68;
  --card-back: #110d1f;
  --card-border: #2e1f5e;
  --glow: rgba(201,168,76,0.25);
  /* AI brand colors */
  --claude-color: #d4a843;
  --gemini-color: #4285f4;
  --copilot-color: #00a36c;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  background:var(--bg);
  color:var(--text);
  font-family:'Shippori Mincho','游明朝','Yu Mincho',serif;
  min-height:100svh;
  overflow-x:hidden;
}
body::before{
  content:'';position:fixed;inset:0;
  background:
    radial-gradient(ellipse 80% 60% at 15% 10%, rgba(90,45,138,0.18) 0%, transparent 60%),
    radial-gradient(ellipse 60% 80% at 85% 90%, rgba(201,168,76,0.08) 0%, transparent 60%);
  pointer-events:none;z-index:0;
}
.stars{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.star{position:absolute;background:white;border-radius:50%;animation:twinkle var(--dur,3s) ease-in-out infinite var(--delay,0s);opacity:0;}
@keyframes twinkle{0%,100%{opacity:0;transform:scale(0.4)}50%{opacity:var(--op,.6);transform:scale(1)}}

/* ヘッダー */
header{position:relative;z-index:10;text-align:center;padding:clamp(40px,8vw,70px) 20px 16px}
.title-en{font-family:'Cinzel Decorative',serif;font-size:11px;letter-spacing:8px;color:var(--gold);opacity:0.6;margin-bottom:10px;}
.title-ja{font-size:clamp(22px,6vw,30px);font-weight:300;letter-spacing:10px;background:linear-gradient(135deg,var(--gold2),var(--gold3),var(--purple3));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
.divider{width:80px;height:1px;margin:14px auto;background:linear-gradient(90deg,transparent,var(--gold),transparent);position:relative;}
.divider::before{content:'✦';position:absolute;top:-8px;left:50%;transform:translateX(-50%);color:var(--gold);font-size:10px;background:var(--bg);padding:0 6px;}

/* スプレッド */
.spread-selector{position:relative;z-index:10;display:flex;gap:8px;padding:0 16px;overflow-x:auto;scrollbar-width:none;justify-content:center;flex-wrap:wrap;margin-bottom:4px;}
.spread-btn{flex-shrink:0;padding:7px 14px;border:1px solid var(--card-border);background:rgba(14,11,26,0.8);color:var(--text2);font-family:'Shippori Mincho',serif;font-size:11px;letter-spacing:2px;border-radius:20px;cursor:pointer;transition:all .3s;white-space:nowrap;}
.spread-btn.active{border-color:var(--gold);color:var(--gold);background:rgba(201,168,76,0.08);box-shadow:0 0 14px var(--glow);}

/* 質問 */
.question-area{position:relative;z-index:10;padding:16px 20px 0}
.question-input{width:100%;background:rgba(14,11,26,0.9);border:1px solid var(--card-border);border-radius:12px;padding:13px 16px;color:var(--text);font-family:'Shippori Mincho',serif;font-size:13px;letter-spacing:1px;outline:none;transition:border-color .3s;resize:none;height:56px;}
.question-input::placeholder{color:var(--text2);opacity:0.5}
.question-input:focus{border-color:var(--purple2)}

/* カード */
.card-table{position:relative;z-index:10;min-height:180px;display:flex;align-items:center;justify-content:center;padding:24px 16px;gap:10px;flex-wrap:wrap;}
.card-slot{perspective:900px}
.card{width:78px;height:128px;position:relative;transform-style:preserve-3d;transition:transform .75s cubic-bezier(.4,0,.2,1);cursor:pointer;}
.card.flipped{transform:rotateY(180deg)}
.card-face{position:absolute;inset:0;border-radius:10px;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;}
.card-back{background:var(--card-back);border:1.5px solid var(--card-border);box-shadow:0 4px 24px rgba(0,0,0,.7),inset 0 0 40px rgba(90,45,138,.08);}
.card-back::before{content:'';position:absolute;inset:7px;border:1px solid rgba(90,45,138,.25);border-radius:6px;background:repeating-linear-gradient(45deg,transparent,transparent 7px,rgba(90,45,138,.03) 7px,rgba(90,45,138,.03) 8px);}
.card-back-symbol{font-size:26px;opacity:.35;position:relative;z-index:1}
.card-front{background:linear-gradient(160deg,#1a1130 0%,#0f0c1e 100%);border:1.5px solid var(--gold);box-shadow:0 4px 24px rgba(0,0,0,.9),0 0 20px var(--glow);transform:rotateY(180deg);padding:8px 6px;justify-content:space-between;}
.card-number{font-family:'Cinzel Decorative',serif;font-size:7px;color:var(--gold);opacity:.55;letter-spacing:1px;align-self:flex-start;}
.card-symbol-front{font-size:30px;line-height:1}
.card-name-ja{font-size:9px;letter-spacing:2px;color:var(--gold2);text-align:center;font-weight:500}
.card-orientation{font-size:7px;color:var(--text2);letter-spacing:1px}
.card.reversed.flipped .card-front{transform:rotateY(180deg) rotate(180deg)}

/* アクション */
.action-area{position:relative;z-index:10;display:flex;flex-direction:column;align-items:center;gap:10px;padding:0 20px 20px;}
.instruction{font-size:11px;letter-spacing:2px;color:var(--text2);text-align:center;margin-bottom:2px;min-height:20px;}
.shuffle-btn{position:relative;width:100%;max-width:300px;padding:17px;background:transparent;border:1.5px solid var(--gold);border-radius:8px;color:var(--gold);font-family:'Cinzel Decorative',serif;font-size:12px;letter-spacing:4px;cursor:pointer;overflow:hidden;transition:all .4s;}
.shuffle-btn:active{background:rgba(201,168,76,.08);box-shadow:0 0 30px var(--glow)}
.shuffle-btn.loading{pointer-events:none;border-color:var(--purple2);color:var(--purple2);opacity:.7}
.reveal-btn{width:100%;max-width:300px;padding:13px;background:rgba(90,45,138,.15);border:1px solid var(--purple);border-radius:8px;color:var(--purple3);font-family:'Shippori Mincho',serif;font-size:12px;letter-spacing:2px;cursor:pointer;transition:all .3s;display:none;}
.reveal-btn.show{display:block}
.reset-btn{width:100%;max-width:300px;padding:11px;background:transparent;border:1px solid rgba(255,255,255,.08);border-radius:8px;color:var(--text2);font-family:'Shippori Mincho',serif;font-size:11px;letter-spacing:3px;cursor:pointer;transition:all .3s;display:none;}
.reset-btn.show{display:block}
.reset-btn:active{border-color:var(--gold);color:var(--gold)}

/* カード結果 */
.result-area{position:relative;z-index:10;padding:0 20px 0;display:none}
.result-area.show{display:block}
.result-card{background:rgba(14,11,26,.95);border:1px solid var(--card-border);border-radius:16px;padding:18px;margin-bottom:10px;animation:fadeUp .55s ease forwards;opacity:0;}
.result-card:nth-child(1){animation-delay:.05s}
.result-card:nth-child(2){animation-delay:.18s}
.result-card:nth-child(3){animation-delay:.31s}
.result-card:nth-child(4){animation-delay:.44s}
.result-card:nth-child(5){animation-delay:.57s}
@keyframes fadeUp{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}
.pos-label{font-size:9px;letter-spacing:3px;color:var(--gold);opacity:.65;margin-bottom:4px}
.result-name{display:flex;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.result-name-ja{font-size:19px;font-weight:500;color:var(--gold2);letter-spacing:2px}
.result-ori{font-size:10px;padding:2px 8px;border-radius:10px;border:1px solid}
.result-ori.upright{border-color:var(--gold);color:var(--gold)}
.result-ori.reversed{border-color:#c06060;color:#c06060}
.result-keywords{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:10px}
.keyword-tag{font-size:10px;padding:3px 10px;background:rgba(90,45,138,.18);border:1px solid rgba(90,45,138,.38);border-radius:10px;color:var(--purple3);letter-spacing:1px;}
.result-advice{font-size:12px;line-height:2;color:var(--text2);border-top:1px solid rgba(255,255,255,.04);padding-top:10px;}
.element-note{font-size:10px;color:rgba(138,122,104,.6);margin-top:8px;letter-spacing:1px;font-style:italic;}
.wuxing-badge{font-size:10px;padding:2px 8px;border-radius:8px;border:1px solid}
.wx-木{background:rgba(76,160,76,.15);color:#7dca7d;border-color:rgba(76,160,76,.3)}
.wx-火{background:rgba(200,80,60,.15);color:#e88c7a;border-color:rgba(200,80,60,.3)}
.wx-土{background:rgba(180,150,80,.15);color:#d4b870;border-color:rgba(180,150,80,.3)}
.wx-金{background:rgba(200,180,120,.15);color:#e8d898;border-color:rgba(200,180,120,.3)}
.wx-水{background:rgba(60,120,200,.15);color:#7aaee8;border-color:rgba(60,120,200,.3)}

/* ═══ AI読み解きセクション ═══ */
.ai-section{
  position:relative;z-index:10;
  padding:0 20px 20px;
  display:none;
}
.ai-section.show{display:block}

/* APIキー入力エリア */
.api-keys-panel{
  background:rgba(14,11,26,.98);
  border:1px solid var(--card-border);
  border-radius:16px;
  padding:18px;
  margin-bottom:16px;
}
.api-keys-title{
  font-size:10px;letter-spacing:3px;color:var(--gold);
  opacity:.7;margin-bottom:14px;text-align:center;
}
.api-key-row{
  display:flex;align-items:center;gap:10px;
  margin-bottom:10px;
}
.ai-label{
  display:flex;align-items:center;gap:6px;
  font-size:11px;letter-spacing:1px;
  min-width:80px;font-weight:500;
}
.ai-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
.dot-claude{background:var(--claude-color)}
.dot-gemini{background:var(--gemini-color)}
.dot-copilot{background:var(--copilot-color)}
.api-key-input{
  flex:1;background:rgba(7,5,15,.8);
  border:1px solid var(--card-border);
  border-radius:8px;padding:8px 12px;
  color:var(--text);font-family:monospace;font-size:11px;
  outline:none;transition:border-color .3s;
}
.api-key-input:focus{border-color:var(--purple2)}
.api-key-input::placeholder{color:var(--text2);opacity:.4}

/* 読み解きボタン */
.ai-read-btn{
  width:100%;padding:16px;
  background:linear-gradient(135deg,rgba(201,168,76,.12),rgba(90,45,138,.15));
  border:1px solid var(--gold);border-radius:10px;
  color:var(--gold2);font-family:'Cinzel Decorative',serif;
  font-size:12px;letter-spacing:3px;cursor:pointer;
  transition:all .4s;margin-bottom:16px;
  position:relative;overflow:hidden;
}
.ai-read-btn:active{background:rgba(201,168,76,.2);box-shadow:0 0 30px var(--glow)}
.ai-read-btn.loading{pointer-events:none;opacity:.6}
.ai-read-btn::after{
  content:'';position:absolute;inset:0;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.04),transparent);
  transform:translateX(-100%);
}
.ai-read-btn.loading::after{animation:shimmer 1.5s infinite}
@keyframes shimmer{to{transform:translateX(100%)}}

/* AI比較パネル */
.ai-compare-grid{
  display:grid;
  grid-template-columns:1fr;
  gap:12px;
}
@media(min-width:700px){
  .ai-compare-grid{grid-template-columns:repeat(3,1fr)}
}
.ai-panel{
  background:rgba(14,11,26,.97);
  border:1px solid var(--card-border);
  border-radius:14px;
  overflow:hidden;
  transition:border-color .4s;
}
.ai-panel.active-claude{border-color:var(--claude-color)}
.ai-panel.active-gemini{border-color:var(--gemini-color)}
.ai-panel.active-copilot{border-color:var(--copilot-color)}
.ai-panel-header{
  display:flex;align-items:center;gap:8px;
  padding:12px 16px;
  border-bottom:1px solid rgba(255,255,255,.04);
}
.ai-panel-name{font-size:12px;letter-spacing:2px;font-weight:500}
.ai-panel-name.claude-name{color:var(--claude-color)}
.ai-panel-name.gemini-name{color:var(--gemini-color)}
.ai-panel-name.copilot-name{color:var(--copilot-color)}
.ai-status{font-size:10px;margin-left:auto;opacity:.6;letter-spacing:1px}
.ai-status.thinking{color:var(--purple3);animation:pulse 1.5s ease-in-out infinite}
.ai-status.done{color:#7dca7d}
.ai-status.error{color:#c06060}
@keyframes pulse{0%,100%{opacity:.4}50%{opacity:1}}
.ai-panel-body{padding:16px;min-height:120px;}
.ai-response-text{
  font-size:12px;line-height:2;color:var(--text2);
  white-space:pre-wrap;
}
.ai-placeholder{
  font-size:11px;color:rgba(138,122,104,.35);
  letter-spacing:2px;text-align:center;
  padding:20px 0;
}
.ai-no-key{
  font-size:11px;color:rgba(138,122,104,.4);
  letter-spacing:1px;text-align:center;padding:16px 0;
  border:1px dashed rgba(255,255,255,.06);border-radius:8px;
}

/* タブ切替（モバイル用） */
.ai-tabs{
  display:flex;gap:6px;margin-bottom:12px;
}
@media(min-width:700px){.ai-tabs{display:none}}
.ai-tab{
  flex:1;padding:8px;background:rgba(14,11,26,.8);
  border:1px solid var(--card-border);border-radius:8px;
  font-size:11px;cursor:pointer;transition:all .3s;color:var(--text2);
  letter-spacing:1px;text-align:center;
}
.ai-tab.active-tab-claude{border-color:var(--claude-color);color:var(--claude-color)}
.ai-tab.active-tab-gemini{border-color:var(--gemini-color);color:var(--gemini-color)}
.ai-tab.active-tab-copilot{border-color:var(--copilot-color);color:var(--copilot-color)}
.ai-panel.mobile-hidden{display:none}
@media(min-width:700px){.ai-panel.mobile-hidden{display:block}}

/* アニメーション */
@keyframes cardShuffle{
  0%{transform:translateY(0) rotate(0deg)}
  25%{transform:translateY(-14px) rotate(-4deg)}
  75%{transform:translateY(-16px) rotate(-2deg)}
  100%{transform:translateY(0) rotate(0deg)}
}
.card.shuffling{animation:cardShuffle .5s ease-in-out infinite}
.card.shuffling:nth-child(2){animation-delay:.1s}
.card.shuffling:nth-child(3){animation-delay:.2s}
@keyframes wiggle{
  0%,100%{transform:rotate(0deg)}
  30%{transform:rotate(-2deg) translateY(-3px)}
  70%{transform:rotate(2deg) translateY(-3px)}
}
.card.ready:not(.flipped){animation:wiggle 2.5s ease-in-out infinite;cursor:pointer}

.bottom-pad{height:60px}
</style>
</head>
<body>
<div class="stars" id="stars"></div>
<header>
  <div class="title-en">Major Arcana Tarot</div>
  <div class="title-ja">大アルカナ占い</div>
  <div class="divider"></div>
</header>

<div class="spread-selector">
  <button class="spread-btn active" data-spread="one">一枚引き</button>
  <button class="spread-btn" data-spread="three">スリーカード</button>
  <button class="spread-btn" data-spread="yesno">YES / NO</button>
  <button class="spread-btn" data-spread="daily">今日のカード</button>
  <button class="spread-btn" data-spread="celtic">ケルティック</button>
</div>

<div class="question-area">
  <textarea class="question-input" id="question" placeholder="問いかけを記してください…（任意）"></textarea>
</div>

<div class="card-table" id="cardTable"></div>

<div class="action-area">
  <div class="instruction" id="instruction">カードをシャッフルして、運命に問いかけてください</div>
  <button class="shuffle-btn" id="shuffleBtn" onclick="startShuffle()">✦ SHUFFLE ✦</button>
  <button class="reveal-btn" id="revealBtn" onclick="revealAll()">すべて開く</button>
  <button class="reset-btn" id="resetBtn" onclick="resetAll()">↺ もう一度占う</button>
</div>

<div class="result-area" id="resultArea"></div>

<!-- ═══ AI読み解きセクション ═══ -->
<div class="ai-section" id="aiSection">

  <!-- APIキー入力 -->
  <div class="api-keys-panel">
    <div class="api-keys-title">◈ AI 読み解き設定 ◈</div>
    <div class="api-key-row">
      <div class="ai-label"><div class="ai-dot dot-claude"></div><span class="claude-name">Claude</span></div>
      <input class="api-key-input" id="keyC" type="password" placeholder="sk-ant-api03-..." autocomplete="off">
    </div>
    <div class="api-key-row">
      <div class="ai-label"><div class="ai-dot dot-gemini"></div><span class="gemini-name">Gemini</span></div>
      <input class="api-key-input" id="keyG" type="password" placeholder="AIzaSy..." autocomplete="off">
    </div>
    <div class="api-key-row">
      <div class="ai-label"><div class="ai-dot dot-copilot"></div><span class="copilot-name">Copilot</span></div>
      <input class="api-key-input" id="keyP" type="password" placeholder="Azure OpenAI key..." autocomplete="off">
    </div>
  </div>

  <!-- 読み解きボタン -->
  <button class="ai-read-btn" id="aiReadBtn" onclick="readWithAI()">
    ✦ 3つのAIで読み解く ✦
  </button>

  <!-- モバイルタブ -->
  <div class="ai-tabs">
    <button class="ai-tab active-tab-claude" onclick="switchTab('claude')">Claude</button>
    <button class="ai-tab" onclick="switchTab('gemini')">Gemini</button>
    <button class="ai-tab" onclick="switchTab('copilot')">Copilot</button>
  </div>

  <!-- 比較グリッド -->
  <div class="ai-compare-grid">
    <!-- Claude -->
    <div class="ai-panel" id="panelClaude" data-ai="claude">
      <div class="ai-panel-header">
        <div class="ai-dot dot-claude"></div>
        <div class="ai-panel-name claude-name">Claude</div>
        <div class="ai-status" id="statusClaude">待機中</div>
      </div>
      <div class="ai-panel-body">
        <div class="ai-placeholder" id="placeholderClaude">APIキーを入力して読み解きを開始</div>
        <div class="ai-response-text" id="respClaude" style="display:none"></div>
      </div>
    </div>
    <!-- Gemini -->
    <div class="ai-panel mobile-hidden" id="panelGemini" data-ai="gemini">
      <div class="ai-panel-header">
        <div class="ai-dot dot-gemini"></div>
        <div class="ai-panel-name gemini-name">Gemini</div>
        <div class="ai-status" id="statusGemini">待機中</div>
      </div>
      <div class="ai-panel-body">
        <div class="ai-placeholder" id="placeholderGemini">APIキーを入力して読み解きを開始</div>
        <div class="ai-response-text" id="respGemini" style="display:none"></div>
      </div>
    </div>
    <!-- Copilot -->
    <div class="ai-panel mobile-hidden" id="panelCopilot" data-ai="copilot">
      <div class="ai-panel-header">
        <div class="ai-dot dot-copilot"></div>
        <div class="ai-panel-name copilot-name">Copilot</div>
        <div class="ai-status" id="statusCopilot">待機中</div>
      </div>
      <div class="ai-panel-body">
        <div class="ai-placeholder" id="placeholderCopilot">APIキーを入力して読み解きを開始</div>
        <div class="ai-response-text" id="respCopilot" style="display:none"></div>
      </div>
    </div>
  </div>
</div>

<div class="bottom-pad"></div>

<script>

const SYMBOLS = {"M00": "🃏", "M01": "🔮", "M02": "📖", "M03": "🌸", "M04": "⚔️", "M05": "🏛️", "M06": "💞", "M07": "🏺", "M08": "🦁", "M09": "🔦", "M10": "☸️", "M11": "⚖️", "M12": "🙃", "M13": "💀", "M14": "🌊", "M15": "⛓️", "M16": "⚡", "M17": "⭐", "M18": "🌙", "M19": "☀️", "M20": "📯", "M21": "🌍"};
const SPREADS = {
  one:    {count:1, positions:["現在の状況"]},
  three:  {count:3, positions:["過去","現在","未来"]},
  yesno:  {count:1, positions:["答え"]},
  daily:  {count:1, positions:["今日のメッセージ"]},
  celtic: {count:5, positions:["現状","課題","顕在意識","潜在意識","結果"]},
};
const SPREAD_LABELS = {
  one:"ワンオラクル", three:"スリーカード（過去・現在・未来）",
  yesno:"YES/NO占い", daily:"今日の一枚", celtic:"ケルティッククロス（簡易5枚）"
};

let currentSpread = 'one';
let drawnCards = [];
let flippedCount = 0;
let phase = 'idle';
let mobileTab = 'claude';

// ── 星 ──
function createStars() {
  const c = document.getElementById('stars');
  for (let i = 0; i < 90; i++) {
    const s = document.createElement('div');
    s.className = 'star';
    const sz = Math.random()*2+0.4;
    s.style.cssText = `width:${sz}px;height:${sz}px;left:${Math.random()*100}%;top:${Math.random()*100}%;--dur:${2+Math.random()*5}s;--delay:${Math.random()*6}s;--op:${0.25+Math.random()*0.7}`;
    c.appendChild(s);
  }
}

// ── スプレッド選択 ──
document.querySelectorAll('.spread-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.spread-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentSpread = btn.dataset.spread;
    resetAll();
  });
});

// ── シャッフル ──
function startShuffle() {
  if (phase === 'shuffling' || phase === 'selecting') return;
  phase = 'shuffling';
  resetUI();
  const spread = SPREADS[currentSpread];
  const table = document.getElementById('cardTable');
  table.innerHTML = '';
  for (let i = 0; i < spread.count; i++) {
    const slot = document.createElement('div');
    slot.className = 'card-slot';
    slot.innerHTML = `<div class="card shuffling"><div class="card-face card-back"><div class="card-back-symbol">✦</div></div></div>`;
    table.appendChild(slot);
  }
  const btn = document.getElementById('shuffleBtn');
  btn.classList.add('loading'); btn.textContent = '✦ SHUFFLING ✦';
  document.getElementById('instruction').textContent = 'シャッフル中…';

  setTimeout(() => {
    const shuffled = [...CARDS].sort(() => Math.random()-0.5);
    drawnCards = shuffled.slice(0, spread.count).map(c => ({...c, isReversed: Math.random()<0.35}));
    flippedCount = 0;
    table.innerHTML = '';
    drawnCards.forEach((card, i) => {
      const slot = document.createElement('div');
      slot.className = 'card-slot';
      slot.innerHTML = `<div class="card ready" id="card-${i}" onclick="flipCard(${i})">
        <div class="card-face card-back"><div class="card-back-symbol">✦</div></div>
        <div class="card-face card-front">
          <div class="card-number">No.${card.number}</div>
          <div class="card-symbol-front">${SYMBOLS[card.id]}</div>
          <div class="card-name-ja">${card.name_ja}</div>
          <div class="card-orientation">${card.isReversed ? '逆位置' : '正位置'}</div>
        </div>
      </div>`;
      table.appendChild(slot);
    });
    btn.classList.remove('loading'); btn.textContent = '✦ SHUFFLE ✦';
    document.getElementById('instruction').textContent =
      spread.count===1 ? 'カードに触れて、運命を開いてください' : `${spread.count}枚のカードを順に開いてください`;
    document.getElementById('revealBtn').classList.add('show');
    phase = 'selecting';
  }, 1800);
}

function flipCard(i) {
  if (phase !== 'selecting') return;
  const el = document.getElementById(`card-${i}`);
  if (!el || el.classList.contains('flipped')) return;
  el.classList.remove('ready');
  if (drawnCards[i].isReversed) el.classList.add('reversed');
  el.classList.add('flipped');
  flippedCount++;
  if (flippedCount === drawnCards.length) setTimeout(showResults, 650);
}

function revealAll() {
  if (phase !== 'selecting') return;
  drawnCards.forEach((_, i) => flipCard(i));
}

function showResults() {
  phase = 'done';
  const spread = SPREADS[currentSpread];
  const area = document.getElementById('resultArea');
  area.innerHTML = '';
  drawnCards.forEach((card, i) => {
    const ori = card.isReversed ? card.reversed : card.upright;
    const oriLabel = card.isReversed ? '逆位置' : '正位置';
    const oriClass = card.isReversed ? 'reversed' : 'upright';
    const div = document.createElement('div');
    div.className = 'result-card';
    div.innerHTML = `
      <div class="pos-label">${spread.positions[i] || `カード ${i+1}`}</div>
      <div class="result-name">
        <span class="result-name-ja">${SYMBOLS[card.id]} ${card.name_ja}</span>
        <span class="result-ori ${oriClass}">${oriLabel}</span>
        <span class="wuxing-badge wx-${card.wuxing}">${card.wuxing}</span>
      </div>
      <div class="result-keywords">${ori.keywords.map(k=>`<span class="keyword-tag">${k}</span>`).join('')}</div>
      <div class="result-advice">${ori.action_advice}</div>
      <div class="element-note">${card.element_note}</div>
    `;
    area.appendChild(div);
  });
  area.classList.add('show');
  // AI読み解きセクション表示
  document.getElementById('aiSection').classList.add('show');
  resetAIPanels();
  area.scrollIntoView({behavior:'smooth', block:'start'});
  document.getElementById('revealBtn').classList.remove('show');
  document.getElementById('resetBtn').classList.add('show');
  document.getElementById('instruction').textContent = 'カードはあなたに語りかけています';
}

function resetUI() {
  document.getElementById('resultArea').classList.remove('show');
  document.getElementById('resultArea').innerHTML = '';
  document.getElementById('aiSection').classList.remove('show');
  document.getElementById('revealBtn').classList.remove('show');
  document.getElementById('resetBtn').classList.remove('show');
}

function resetAll() {
  drawnCards = []; flippedCount = 0; phase = 'idle';
  document.getElementById('cardTable').innerHTML = '';
  document.getElementById('question').value = '';
  resetUI();
  document.getElementById('instruction').textContent = 'カードをシャッフルして、運命に問いかけてください';
}

// ═══ AI 読み解きロジック ═══

function buildPrompt() {
  const spread = SPREADS[currentSpread];
  const spreadLabel = SPREAD_LABELS[currentSpread];
  const question = document.getElementById('question').value.trim();
  let ctx = `【スプレッド】${spreadLabel}\n【質問】${question || '（指定なし）'}\n\n`;
  drawnCards.forEach((card, i) => {
    const ori = card.isReversed ? card.reversed : card.upright;
    const oriJa = card.isReversed ? '逆位置' : '正位置';
    ctx += `■ ${spread.positions[i]}：${card.name_ja}（${card.name_en}）${oriJa}\n`;
    ctx += `  キーワード：${ori.keywords.join('・')}\n`;
    ctx += `  意味：${ori.action_advice}\n  五行：${card.wuxing}（${card.element_note}）\n\n`;
  });
  return ctx;
}

const SYSTEM_PROMPT = `あなたは神秘的で洞察力のあるタロット占い師「叡智の声」です。以下のルールで占いの解読を行ってください。
- 日本語で、詩的かつ親しみやすい文体で語りかけてください
- 各カードの意味を統合し、全体的なメッセージとして伝えてください
- スプレッドの文脈（位置の意味）を必ず考慮してください
- 五行（木火土金水）の観点も織り交ぜてください
- 300〜400文字程度でまとめてください
- 最後に一言、励ましや行動のヒントを添えてください`;

function setStatus(ai, status, text) {
  const el = document.getElementById(`status${ai}`);
  const panel = document.getElementById(`panel${ai}`);
  el.className = `ai-status ${status}`;
  el.textContent = text;
  panel.className = `ai-panel${status==='done'||status==='thinking' ? ` active-${ai.toLowerCase()}` : ''}`;
}

function setResponse(ai, text, isError=false) {
  const ph = document.getElementById(`placeholder${ai}`);
  const resp = document.getElementById(`resp${ai}`);
  ph.style.display = 'none';
  resp.style.display = 'block';
  resp.style.color = isError ? '#c06060' : 'var(--text2)';
  resp.textContent = text;
}

function resetAIPanels() {
  ['Claude','Gemini','Copilot'].forEach(ai => {
    setStatus(ai, '', '待機中');
    document.getElementById(`placeholder${ai}`).style.display = 'block';
    document.getElementById(`resp${ai}`).style.display = 'none';
    document.getElementById(`resp${ai}`).textContent = '';
    document.getElementById(`panel${ai}`).className = 'ai-panel' + (ai==='Gemini'||ai==='Copilot' ? ' mobile-hidden' : '');
  });
}

// モバイルタブ切替
function switchTab(ai) {
  mobileTab = ai;
  document.querySelectorAll('.ai-tab').forEach(t => {
    t.className = 'ai-tab';
    if (t.textContent.toLowerCase() === ai) t.classList.add(`active-tab-${ai}`);
  });
  ['Claude','Gemini','Copilot'].forEach(name => {
    const panel = document.getElementById(`panel${name}`);
    if (name.toLowerCase() === ai) {
      panel.classList.remove('mobile-hidden');
    } else {
      if (!panel.classList.contains('mobile-hidden')) panel.classList.add('mobile-hidden');
    }
  });
}

// ── Claude API ──
async function callClaude(prompt, apiKey) {
  const res = await fetch('https://api.anthropic.com/v1/messages', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'x-api-key': apiKey,
      'anthropic-version': '2023-06-01',
    },
    body: JSON.stringify({
      model: 'claude-sonnet-4-20250514',
      max_tokens: 1000,
      system: SYSTEM_PROMPT,
      messages: [{role:'user', content: prompt}],
    })
  });
  if (!res.ok) throw new Error(`Claude API Error: ${res.status}`);
  const data = await res.json();
  return data.content[0].text;
}

// ── Gemini API ──
async function callGemini(prompt, apiKey) {
  const body = {
    system_instruction: {parts:[{text: SYSTEM_PROMPT}]},
    contents: [{parts:[{text: prompt}]}],
    generationConfig: {maxOutputTokens: 1000}
  };
  const res = await fetch(
    `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`,
    {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body)}
  );
  if (!res.ok) throw new Error(`Gemini API Error: ${res.status}`);
  const data = await res.json();
  return data.candidates[0].content.parts[0].text;
}

// ── Copilot (Azure OpenAI / OpenAI互換) ──
async function callCopilot(prompt, apiKey) {
  // OpenAI互換エンドポイント（Copilot Studioまたは直接OpenAI）
  const res = await fetch('https://api.openai.com/v1/chat/completions', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'Authorization': `Bearer ${apiKey}`,
    },
    body: JSON.stringify({
      model: 'gpt-4o',
      max_tokens: 1000,
      messages: [
        {role:'system', content: SYSTEM_PROMPT},
        {role:'user', content: prompt}
      ],
    })
  });
  if (!res.ok) throw new Error(`Copilot API Error: ${res.status}`);
  const data = await res.json();
  return data.choices[0].message.content;
}

// ── メイン読み解き ──
async function readWithAI() {
  const btn = document.getElementById('aiReadBtn');
  btn.classList.add('loading');
  btn.textContent = '✦ 読み解き中… ✦';

  const prompt = buildPrompt();
  const keyC = document.getElementById('keyC').value.trim();
  const keyG = document.getElementById('keyG').value.trim();
  const keyP = document.getElementById('keyP').value.trim();

  const tasks = [];

  // Claude
  if (keyC) {
    setStatus('Claude','thinking','思考中…');
    tasks.push(
      callClaude(prompt, keyC)
        .then(t => { setStatus('Claude','done','完了 ✓'); setResponse('Claude', t); })
        .catch(e => { setStatus('Claude','error','エラー'); setResponse('Claude', e.message, true); })
    );
  } else {
    document.getElementById('placeholderClaude').innerHTML = '<div class="ai-no-key">APIキー未入力</div>';
  }

  // Gemini
  if (keyG) {
    setStatus('Gemini','thinking','思考中…');
    tasks.push(
      callGemini(prompt, keyG)
        .then(t => { setStatus('Gemini','done','完了 ✓'); setResponse('Gemini', t); })
        .catch(e => { setStatus('Gemini','error','エラー'); setResponse('Gemini', e.message, true); })
    );
  } else {
    document.getElementById('placeholderGemini').innerHTML = '<div class="ai-no-key">APIキー未入力</div>';
  }

  // Copilot
  if (keyP) {
    setStatus('Copilot','thinking','思考中…');
    tasks.push(
      callCopilot(prompt, keyP)
        .then(t => { setStatus('Copilot','done','完了 ✓'); setResponse('Copilot', t); })
        .catch(e => { setStatus('Copilot','error','エラー'); setResponse('Copilot', e.message, true); })
    );
  } else {
    document.getElementById('placeholderCopilot').innerHTML = '<div class="ai-no-key">APIキー未入力</div>';
  }

  if (tasks.length === 0) {
    btn.classList.remove('loading');
    btn.textContent = '✦ 3つのAIで読み解く ✦';
    return;
  }

  await Promise.allSettled(tasks);
  btn.classList.remove('loading');
  btn.textContent = '✦ 再度読み解く ✦';
}
