services:
  - type: web
    name: fortune-project-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server.app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false        # Render ダッシュボードで手動設定
      - key: PYTHON_VERSION
        value: 3.11.0
