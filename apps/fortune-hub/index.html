<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>fortune-hub 窶・豌励・鄒・・逶､</title>
<style>
:root {
  --bg:     #0a0a0f;
  --surf:   #12121a;
  --card:   #1a1a28;
  --border: rgba(212,175,106,0.13);
  --bact:   rgba(212,175,106,0.5);
  --gold:   #d4af6a;
  --goldd:  rgba(212,175,106,0.14);
  --text:   #e8dcc8;
  --sub:    #6a6058;
  --muted:  #2e2e3e;
  --wood:   #4a9e6b; --woodd: rgba(74,158,107,0.18);
  --fire:   #c0392b; --fired: rgba(192,57,43,0.18);
  --earth:  #c8922a; --earthd:rgba(200,146,42,0.18);
  --metal:  #a8b8c8; --metald:rgba(168,184,200,0.18);
  --water:  #2980b9; --waterd:rgba(41,128,185,0.18);
  --fk: 'Noto Serif JP',serif;
  --fu: 'Noto Sans JP',sans-serif;
  --safe-b: env(safe-area-inset-bottom);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{font-size:16px}
body{background:var(--bg);color:var(--text);font-family:var(--fu);
  min-height:100dvh;overscroll-behavior:none;
  display:flex;flex-direction:column;align-items:center}

/* 笏笏 HEADER 笏笏 */
header{width:100%;max-width:480px;padding:2.2rem 1.4rem .8rem;text-align:center}
.eyebrow{font-size:.65rem;letter-spacing:.22em;color:var(--sub);text-transform:uppercase;margin-bottom:.4rem}
h1{font-family:var(--fk);font-size:1.75rem;color:var(--gold);letter-spacing:.07em;font-weight:400}
.h-sub{font-size:.75rem;color:var(--sub);margin-top:.3rem}

/* 譎ょ綾繝舌ャ繧ｸ */
.time-row{display:flex;justify-content:center;gap:1.2rem;margin:.8rem 0 .2rem;font-size:.72rem;color:var(--sub)}
.time-row b{color:var(--gold);font-family:var(--fk)}

main{width:100%;max-width:480px;padding:0 1.2rem;flex:1}

/* 笏笏 雉ｪ蝠・笏笏 */
textarea{width:100%;background:var(--card);border:1px solid var(--border);
  border-radius:14px;color:var(--text);font-family:var(--fk);font-size:.93rem;
  line-height:1.75;padding:.9rem 1rem;resize:none;outline:none;
  transition:border-color .25s;min-height:76px;margin-bottom:1rem}
textarea::placeholder{color:var(--muted)}
textarea:focus{border-color:var(--bact)}

/* 笏笏 繝・・繝ｫ繧ｰ繝ｪ繝・ラ 笏笏 */
.tools{display:grid;grid-template-columns:1fr 1fr;gap:.65rem;margin-bottom:1rem}
.tool{background:var(--card);border:1px solid var(--border);border-radius:14px;
  color:var(--text);cursor:pointer;display:flex;flex-direction:column;
  align-items:center;gap:.25rem;padding:.9rem .5rem .75rem;
  transition:all .2s;-webkit-tap-highlight-color:transparent}
.tool:hover{border-color:var(--bact);background:#1e1e2e}
.tool:active{transform:scale(.96)}
.tool.on{border-color:var(--gold);background:var(--goldd)}
.tool-sym{font-size:1.5rem;line-height:1}
.tool-nm{font-family:var(--fk);font-size:.75rem;color:var(--gold)}
.tool-ds{font-size:.62rem;color:var(--sub)}

/* 笏笏 蜊縺・・繧ｿ繝ｳ 笏笏 */
.go{width:100%;background:linear-gradient(135deg,#b8942a,var(--gold));
  border:none;border-radius:14px;color:#0a0a0f;cursor:pointer;
  font-family:var(--fk);font-size:.95rem;font-weight:700;
  letter-spacing:.1em;padding:.9rem;transition:filter .2s,transform .15s;
  -webkit-tap-highlight-color:transparent;margin-bottom:1.4rem}
.go:hover{filter:brightness(1.08)}
.go:active{transform:scale(.98)}
.go:disabled{opacity:.4;cursor:not-allowed}

/* 笏笏 繧ｨ繝ｩ繝ｼ 笏笏 */
.err{background:rgba(192,57,43,.12);border:1px solid rgba(192,57,43,.3);
  border-radius:10px;color:#e07070;font-size:.8rem;padding:.65rem .9rem;
  margin-bottom:1rem;display:none}
.err.on{display:block}

/* 笏笏 繝ｭ繝ｼ繝・ぅ繝ｳ繧ｰ 笏笏 */
.loading{display:none;flex-direction:column;align-items:center;gap:.7rem;padding:1.8rem}
.loading.on{display:flex}
.spin{width:34px;height:34px;border:2px solid var(--muted);
  border-top-color:var(--gold);border-radius:50%;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.load-txt{font-family:var(--fk);font-size:.82rem;color:var(--sub)}

/* 笏笏 繝ｬ繝ｼ繝繝ｼ繧ｻ繧ｯ繧ｷ繝ｧ繝ｳ 笏笏 */
.radar-sec{background:var(--card);border:1px solid var(--border);
  border-radius:20px;padding:1.4rem 1.1rem 1.1rem;margin-bottom:1.1rem;display:none}
.radar-sec.on{display:block}
.sec-lbl{font-size:.62rem;letter-spacing:.18em;color:var(--sub);
  text-transform:uppercase;margin-bottom:1rem;text-align:center}

/* SVG繝ｬ繝ｼ繝繝ｼ */
.radar-wrap{display:flex;justify-content:center;margin-bottom:1rem}
svg#radar{width:180px;height:180px;overflow:visible}

/* 莠碑｡後ヰ繝ｼ */
.wx-bars{display:flex;flex-direction:column;gap:.5rem}
.wx-row{display:grid;grid-template-columns:1.6rem 1fr 2.2rem;align-items:center;gap:.55rem}
.wx-k{font-family:var(--fk);font-size:.85rem;text-align:center}
.bar-bg{background:var(--muted);border-radius:99px;height:5px;overflow:hidden}
.bar-f{height:100%;border-radius:99px;transition:width .85s cubic-bezier(.23,1,.32,1);width:0}
.wx-v{font-size:.68rem;color:var(--sub);text-align:right}

/* 笏笏 邨先棡繧ｫ繝ｼ繝・笏笏 */
.result{background:var(--card);border:1px solid var(--border);
  border-radius:20px;padding:1.4rem 1.1rem;margin-bottom:.9rem;
  display:none;animation:fadeUp .5s cubic-bezier(.23,1,.32,1) both}
.result.on{display:block}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}

.syms{display:flex;justify-content:center;gap:.4rem;font-size:1.7rem;
  margin-bottom:.9rem;letter-spacing:.08em}
.hex-nm{font-family:var(--fk);font-size:1.2rem;color:var(--gold);
  text-align:center;margin-bottom:.3rem}
.core{font-family:var(--fk);font-size:.87rem;color:var(--text);
  text-align:center;line-height:1.75;margin-bottom:1.1rem;padding:0 .4rem}

/* 繧ｿ繝ｭ繝・ヨ繧ｹ繝励Ξ繝・ラ */
.spread{display:flex;flex-direction:column;gap:.45rem;margin-bottom:1rem}
.spread-row{background:var(--surf);border-radius:10px;padding:.55rem .8rem}
.spread-pos{font-size:.62rem;color:var(--sub);margin-bottom:.15rem}
.spread-card{font-family:var(--fk);font-size:.9rem;color:var(--gold)}
.spread-rev{font-size:.62rem;color:var(--fire);margin-left:.4rem}
.spread-kw{font-size:.7rem;color:var(--sub);margin-top:.15rem}

/* AI隱ｭ縺ｿ隗｣縺・*/
.ai-sec{border-top:1px solid var(--border);padding-top:.9rem}
.ai-lbl{font-size:.62rem;letter-spacing:.16em;color:var(--sub);
  text-transform:uppercase;margin-bottom:.55rem}
.ai-core{font-family:var(--fk);font-size:.97rem;color:var(--gold);
  line-height:1.65;margin-bottom:.7rem}
.ai-detail{font-size:.83rem;color:var(--text);line-height:1.85;margin-bottom:.7rem}
.ai-action{background:var(--goldd);border-left:3px solid var(--gold);
  border-radius:0 10px 10px 0;font-size:.8rem;color:var(--text);
  line-height:1.7;padding:.55rem .75rem}
.res-btn{width:100%;background:transparent;border:1px solid var(--border);
  border-radius:12px;color:var(--sub);cursor:pointer;font-family:var(--fu);
  font-size:.75rem;padding:.6rem .9rem;text-align:left;margin-top:.7rem;
  transition:border-color .2s,color .2s;display:none}
.res-btn.on{display:block}
.res-btn:hover{border-color:var(--bact);color:var(--gold)}

/* 笏笏 螻･豁ｴ 笏笏 */
.hist-sec{margin-bottom:1.8rem}
.hist-lbl{font-size:.62rem;letter-spacing:.16em;color:var(--sub);
  text-transform:uppercase;margin-bottom:.55rem}
.hist-list{display:flex;flex-direction:column;gap:.45rem}
.hist-item{background:var(--surf);border:1px solid var(--border);
  border-radius:10px;cursor:pointer;display:grid;
  grid-template-columns:auto 1fr auto;align-items:center;
  gap:.65rem;padding:.6rem .85rem;transition:border-color .2s}
.hist-item:hover{border-color:var(--bact)}
.hist-t{font-size:.95rem}
.hist-q{font-size:.76rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hist-time{font-size:.62rem;color:var(--sub);white-space:nowrap}

/* 笏笏 繝翫ン 笏笏 */
.nav{position:fixed;bottom:0;left:0;right:0;background:var(--surf);
  border-top:1px solid var(--border);display:flex;justify-content:space-around;
  padding:.45rem 0 max(.45rem,var(--safe-b));z-index:50}
.nav a{display:flex;flex-direction:column;align-items:center;gap:2px;
  color:var(--sub);font-size:.58rem;min-width:44px;min-height:44px;
  justify-content:center;text-decoration:none;
  -webkit-tap-highlight-color:transparent;transition:color .2s}
.nav a.on,.nav a:hover{color:var(--gold)}
.nav-ic{font-size:1.2rem;line-height:1}
.spacer{height:calc(58px + max(0px,var(--safe-b)))}
</style>
</head>
<body>

<header>
  <p class="eyebrow">譚ｱ豢句頃陦・邨ｱ蜷医ワ繝・/p>
  <h1>豌励・鄒・・逶､</h1>
  <p class="h-sub">譏薙・繧ｿ繝ｭ繝・ヨ繝ｻ鬚ｨ豌ｴ繝ｻ蝗帶浤 窶・縺ｲ縺ｨ縺､縺ｮ蝠上＞繧貞屁縺､縺ｮ繝ｬ繝ｳ繧ｺ縺ｧ</p>
  <div class="time-row">
    <span>譌･蟷ｲ謾ｯ <b id="dk">窶・/b></span>
    <span>荵晄弌 <b id="ky">窶・/b></span>
    <span>譛亥ｻｺ <b id="yj">窶・/b></span>
  </div>
</header>

<main>
  <textarea id="q" rows="3" placeholder="莉翫・迥ｶ豕√↓縺､縺・※蝠上＞繧堤ｫ九※繧銀ｦ&#10;萓具ｼ夊ｻ｢閨ｷ縺ｮ繧ｿ繧､繝溘Φ繧ｰ縺ｯ縺・▽縺瑚憶縺・〒縺吶°"></textarea>

  <div class="tools">
    <button class="tool on" data-tool="iching" onclick="pick(this)">
      <span class="tool-sym">笘ｰ</span>
      <span class="tool-nm">譴・干蠢・・</span>
      <span class="tool-ds">螟牙喧縺ｮ豬√ｌ繧定ｪｭ繧</span>
    </button>
    <button class="tool" data-tool="tarot" onclick="pick(this)">
      <span class="tool-sym">ワ</span>
      <span class="tool-nm">繧ｿ繝ｭ繝・ヨ</span>
      <span class="tool-ds">雎｡蠕ｴ縺ｧ譛ｬ雉ｪ繧呈丐縺・/span>
    </button>
    <button class="tool" data-tool="lopan" onclick="pick(this)">
      <span class="tool-sym">ｧｭ</span>
      <span class="tool-nm">鬚ｨ豌ｴ繝ｻ鄒・乢</span>
      <span class="tool-ds">遨ｺ髢薙・豌励ｒ貂ｬ繧・/span>
    </button>
    <button class="tool" data-tool="shichu" onclick="pick(this)">
      <span class="tool-sym">竢ｳ</span>
      <span class="tool-nm">蝗帶浤謗ｨ蜻ｽ</span>
      <span class="tool-ds">譎る俣縺ｮ豌苓ｳｪ繧定ｪｭ繧</span>
    </button>
  </div>

  <button class="go" id="go" onclick="run()">蜊 縺・/button>
  <div class="err" id="err"></div>
  <div class="loading" id="ld"><div class="spin"></div><p class="load-txt" id="lt">蜊ｦ繧堤ｫ九※縺ｦ縺・∪縺吮ｦ</p></div>

  <!-- 莠碑｡後Ξ繝ｼ繝繝ｼ -->
  <div class="radar-sec" id="rs">
    <p class="sec-lbl">莠碑｡後ヰ繝ｩ繝ｳ繧ｹ</p>
    <div class="radar-wrap">
      <svg id="radar" viewBox="0 0 180 180" xmlns="http://www.w3.org/2000/svg">
        <!-- 繧ｰ繝ｪ繝・ラ -->
        <polygon points="90,18 152,54 152,126 90,162 28,126 28,54" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
        <polygon points="90,36 136,63 136,117 90,144 44,117 44,63"  fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
        <polygon points="90,54 120,72 120,108 90,126 60,108 60,72"  fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
        <!-- 繝・・繧ｿ -->
        <polygon id="rp" points="90,90 90,90 90,90 90,90 90,90"
          fill="rgba(212,175,106,0.13)" stroke="var(--gold)" stroke-width="1.5"
          style="transition:points .85s cubic-bezier(.23,1,.32,1)"/>
        <circle id="r0" cx="90" cy="90" r="3.5" fill="#4a9e6b"/>
        <circle id="r1" cx="90" cy="90" r="3.5" fill="#c0392b"/>
        <circle id="r2" cx="90" cy="90" r="3.5" fill="#c8922a"/>
        <circle id="r3" cx="90" cy="90" r="3.5" fill="#a8b8c8"/>
        <circle id="r4" cx="90" cy="90" r="3.5" fill="#2980b9"/>
        <!-- 繝ｩ繝吶Ν -->
        <text x="90"  y="11"  text-anchor="middle" font-size="9" fill="#4a9e6b" font-family="serif">譛ｨ</text>
        <text x="159" y="57"  text-anchor="start"  font-size="9" fill="#c0392b" font-family="serif">轣ｫ</text>
        <text x="159" y="130" text-anchor="start"  font-size="9" fill="#c8922a" font-family="serif">蝨・/text>
        <text x="21"  y="130" text-anchor="end"    font-size="9" fill="#a8b8c8" font-family="serif">驥・/text>
        <text x="21"  y="57"  text-anchor="end"    font-size="9" fill="#2980b9" font-family="serif">豌ｴ</text>
      </svg>
    </div>
    <div class="wx-bars" id="wb"></div>
  </div>

  <!-- 邨先棡繧ｫ繝ｼ繝・-->
  <div class="result" id="rc">
    <div class="syms"  id="syms"></div>
    <div class="hex-nm" id="hn"></div>
    <div class="core"   id="cm"></div>
    <div id="spread-wrap"></div>
    <div class="ai-sec" id="ai" style="display:none">
      <p class="ai-lbl">AI 隱ｭ縺ｿ隗｣縺・/p>
      <p class="ai-core"   id="ac"></p>
      <p class="ai-detail" id="ad"></p>
      <div class="ai-action" id="aa"></div>
      <button class="res-btn" id="rb" onclick="switchTool()"></button>
    </div>
  </div>

  <!-- 螻･豁ｴ -->
  <div class="hist-sec" id="hs" style="display:none">
    <p class="hist-lbl">逶ｴ霑代・蜊譁ｭ</p>
    <div class="hist-list" id="hl"></div>
  </div>

  <div class="spacer"></div>
</main>

<nav class="nav">
  <a class="on" href="#"><span class="nav-ic">醗</span>蜊縺・/a>
  <a href="http://localhost:8000/docs" target="_blank"><span class="nav-ic">笞呻ｸ・/span>API</a>
  <a href="#" onclick="clearAll()"><span class="nav-ic">笨ｨ</span>繝ｪ繧ｻ繝・ヨ</a>
</nav>

<script>
const API = 'https://fortune-project-api.onrender.com';
const TM = {
  iching:{name:'譴・干蠢・・',sym:'笘ｰ',lt:'蜊ｦ繧堤ｫ九※縺ｦ縺・∪縺吮ｦ'},
  tarot: {name:'繧ｿ繝ｭ繝・ヨ', sym:'ワ',lt:'繧ｫ繝ｼ繝峨ｒ蠑輔＞縺ｦ縺・∪縺吮ｦ'},
  lopan: {name:'鬚ｨ豌ｴ繝ｻ鄒・乢',sym:'ｧｭ',lt:'譁ｹ菴阪ｒ貂ｬ縺｣縺ｦ縺・∪縺吮ｦ'},
  shichu:{name:'蝗帶浤謗ｨ蜻ｽ',sym:'竢ｳ',lt:'蜻ｽ逶､繧堤函謌舌＠縺ｦ縺・∪縺吮ｦ'},
};
const WX = [
  {id:'wood', k:'譛ｨ',c:'#4a9e6b'},{id:'fire', k:'轣ｫ',c:'#c0392b'},
  {id:'earth',k:'蝨・,c:'#c8922a'},{id:'metal',k:'驥・,c:'#a8b8c8'},
  {id:'water',k:'豌ｴ',c:'#2980b9'},
];
const ANCHORS=[[90,18],[152,54],[152,126],[28,126],[28,54]];
const WXK=['wood','fire','earth','metal','water'];

let tool='iching', lastRaw=null, lastRes=null;
let hist=[];try{hist=JSON.parse(localStorage.getItem('fh_hist')||'[]')}catch(_){}

// 蛻晄悄蛹・(()=>{
  const TG=['逕ｲ','荵・,'荳・,'荳・,'謌・,'蟾ｱ','蠎・,'霎・,'螢ｬ','逋ｸ'];
  const DZ=['蟄・,'荳・,'蟇・,'蜊ｯ','霎ｰ','蟾ｳ','蜊・,'譛ｪ','逕ｳ','驟・,'謌・,'莠･'];
  const now=new Date();
  const d=Math.floor((now-new Date(2024,0,1))/86400000);
  document.getElementById('dk').textContent=TG[((d%10)+10)%10]+DZ[((d%12)+12)%12];
  document.getElementById('yj').textContent=DZ[((now.getMonth()+2)%12)];
  const y=now.getFullYear();
  document.getElementById('ky').textContent=(((11-(y%9))%9)||9)+'譏・;
  renderHist();
})();

function pick(btn){
  document.querySelectorAll('.tool').forEach(b=>b.classList.remove('on'));
  btn.classList.add('on');
  tool=btn.dataset.tool;
}

async function run(){
  const q=document.getElementById('q').value.trim();
  if(!q){showErr('蝠上＞繧貞・蜉帙＠縺ｦ縺上□縺輔＞縲・);return}
  setLoad(true); hideErr(); hideRes();
  document.getElementById('lt').textContent=TM[tool].lt;
  try{
    const r=await fetch(`${API}/fortune/run`,{method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({tool,question:q})});
    if(!r.ok)throw new Error(`${r.status}`);
    const d=await r.json();
    lastRaw=d;
    drawRadar(d.wuxing);
    drawRun(d);
    saveHist({tool,question:q,summary:d.summary,ts:Date.now()});
    document.getElementById('lt').textContent='AI 縺瑚ｪｭ縺ｿ隗｣縺・※縺・∪縺吮ｦ';
    try{
      const qr=await fetch(`${API}/fortune/query`,{method:'POST',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({tool,question:q,raw_result:d.raw_result})});
      if(qr.ok)drawAI(await qr.json());
    }catch(_){}
  }catch(e){showErr(`繧ｨ繝ｩ繝ｼ: ${e.message} 窶・繧ｵ繝ｼ繝舌・縺瑚ｵｷ蜍輔＠縺ｦ縺・ｋ縺狗｢ｺ隱阪＠縺ｦ縺上□縺輔＞縲Ａ)}
  finally{setLoad(false)}
}

// 笏笏 繝ｬ繝ｼ繝繝ｼ謠冗判 笏笏笏笏笏笏笏笏笏笏笏笏笏笏笏笏笏笏笏笏笏笏笏笏笏笏笏笏笏笏
function drawRadar(wx){
  const pts=WXK.map((k,i)=>{
    const v=wx[k]||0,[ax,ay]=ANCHORS[i];
    return[90+(ax-90)*v, 90+(ay-90)*v];
  });
  document.getElementById('rp').setAttribute('points',pts.map(p=>p.join(',')).join(' '));
  pts.forEach(([x,y],i)=>{
    document.getElementById(`r${i}`).setAttribute('cx',x);
    document.getElementById(`r${i}`).setAttribute('cy',y);
  });
  // 繝舌・
  document.getElementById('wb').innerHTML=WX.map(w=>{
    const pct=Math.round((wx[w.id]||0)*100);
    return`<div class="wx-row">
      <span class="wx-k" style="color:${w.c}">${w.k}</span>
      <div class="bar-bg"><div class="bar-f" style="background:${w.c};width:${pct}%"></div></div>
      <span class="wx-v">${pct}%</span>
    </div>`;
  }).join('');
  document.getElementById('rs').classList.add('on');
}

// 笏笏 蜊陦鍋ｵ先棡謠冗判 笏笏笏笏笏笏笏笏笏笏笏笏笏笏笏笏笏笏笏笏笏笏笏笏笏笏笏笏笏笏
function drawRun(d){
  document.getElementById('syms').textContent=(d.symbols||[]).join(' ');
  const raw=d.raw_result||{};
  document.getElementById('hn').textContent=raw.hexName||raw.note||'';

  // 繧ｿ繝ｭ繝・ヨ
  if(d.tool==='tarot'&&raw.spread){
    document.getElementById('cm').textContent='';
    document.getElementById('spread-wrap').innerHTML=
      `<div class="spread">${raw.spread.map(s=>`
        <div class="spread-row">
          <div class="spread-pos">${s.position}</div>
          <div><span class="spread-card">${s.card}</span>
            ${s.reversed?'<span class="spread-rev">騾・ｽ咲ｽｮ</span>':''}
          </div>
          <div class="spread-kw">${s.keywords}</div>
        </div>`).join('')}</div>`;
  }else{
    document.getElementById('cm').textContent=d.summary||'';
    document.getElementById('spread-wrap').innerHTML='';
  }
  document.getElementById('rc').classList.add('on');
}

// 笏笏 AI謠冗判 笏笏笏笏笏笏笏笏笏笏笏笏笏笏笏笏笏笏笏笏笏笏笏笏笏笏笏笏笏笏笏笏笏笏笏
function drawAI(d){
  document.getElementById('ac').textContent=d.core||'';
  document.getElementById('ad').textContent=d.detail||'';
  document.getElementById('aa').textContent=d.action||'';
  if(d.resonance?.suggestedTool){
    lastRes=d.resonance;
    const m=TM[d.resonance.suggestedTool];
    const rb=document.getElementById('rb');
    rb.textContent=`${m?.sym||''} ${d.resonance.reason} 竊・${m?.name}縺ｧ豺ｱ謗倥ｊ縺吶ｋ`;
    rb.classList.add('on');
  }
  document.getElementById('ai').style.display='block';
}

function switchTool(){
  if(!lastRes)return;
  const b=document.querySelector(`[data-tool="${lastRes.suggestedTool}"]`);
  if(b)pick(b);
  document.getElementById('q').focus();
  window.scrollTo({top:0,behavior:'smooth'});
}

// 笏笏 螻･豁ｴ 笏笏笏笏笏笏笏笏笏笏笏笏笏笏笏笏笏笏笏笏笏笏笏笏笏笏笏笏笏笏笏笏笏笏笏笏笏
function saveHist(item){
  hist.unshift(item);hist=hist.slice(0,10);
  try{localStorage.setItem('fh_hist',JSON.stringify(hist))}catch(_){}
  renderHist();
}
function renderHist(){
  if(!hist.length)return;
  document.getElementById('hs').style.display='block';
  document.getElementById('hl').innerHTML=hist.slice(0,5).map((h,i)=>{
    const m=TM[h.tool]||{};
    const t=new Date(h.ts).toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit'});
    return`<div class="hist-item" onclick="replay(${i})">
      <span class="hist-t">${m.sym||'醗'}</span>
      <span class="hist-q">${h.question}</span>
      <span class="hist-time">${t}</span>
    </div>`;
  }).join('');
}
function replay(i){
  const h=hist[i];
  document.getElementById('q').value=h.question;
  const b=document.querySelector(`[data-tool="${h.tool}"]`);
  if(b)pick(b);
  run();
}

// 笏笏 繝ｦ繝ｼ繝・ぅ繝ｪ繝・ぅ 笏笏笏笏笏笏笏笏笏笏笏笏笏笏笏笏笏笏笏笏笏笏笏笏笏笏笏笏
function setLoad(v){
  document.getElementById('ld').classList.toggle('on',v);
  document.getElementById('go').disabled=v;
}
function showErr(m){const e=document.getElementById('err');e.textContent=m;e.classList.add('on')}
function hideErr(){document.getElementById('err').classList.remove('on')}
function hideRes(){
  document.getElementById('rc').classList.remove('on');
  document.getElementById('rs').classList.remove('on');
  document.getElementById('ai').style.display='none';
  document.getElementById('rb').classList.remove('on');
}
function clearAll(){
  document.getElementById('q').value='';
  hideRes();hideErr();
  lastRaw=null;lastRes=null;
}
document.getElementById('q').addEventListener('keydown',e=>{
  if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();run()}
});
</script>
</body>
